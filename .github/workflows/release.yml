name: Release Build

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: 准备版本号
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: 生成版本号
        id: version
        shell: bash
        run: echo "value=$(TZ=Asia/Shanghai date +3.%y.%m%d%H)" >> "$GITHUB_OUTPUT"

  build:
    name: 构建 ${{ matrix.variant }} APK
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        variant: [release, releaseA]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      VARIANT: ${{ matrix.variant }}
      KEYSTORE_BASE64: ${{ secrets.RELEASE_KEY_STORE }}
      ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: ./legado-release.p12
      ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 检查并恢复签名密钥
        shell: bash
        run: |
          set -euo pipefail
          required=(
            KEYSTORE_BASE64
            ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD
            ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS
            ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "缺少 GitHub Actions Secret: ${name#ORG_GRADLE_PROJECT_}"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/legado-release.p12
          chmod 600 app/legado-release.p12
          keytool -list \
            -keystore app/legado-release.p12 \
            -storepass:env ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD \
            -alias "$ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS" \
            > /dev/null

      - name: 配置版本与包名
        shell: bash
        run: |
          set -euo pipefail
          sed -i "/^def version =/c\\def version = \"$VERSION\"" app/build.gradle
          if [[ "$VARIANT" == "releaseA" ]]; then
            sed -i "s/applicationIdSuffix '.release'/applicationIdSuffix '.releaseA'/" app/build.gradle
          fi

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 构建 APK
        run: ./gradlew :app:assembleAppRelease --build-cache --no-daemon --warning-mode all

      - name: 整理构建产物
        shell: bash
        run: |
          set -euo pipefail
          apk_path="$(find app/build/outputs/apk/app/release -type f -name '*.apk' -print -quit)"
          if [[ -z "$apk_path" ]]; then
            echo "未找到构建完成的 APK"
            exit 1
          fi
          mkdir -p dist
          cp "$apk_path" "dist/legado_app_${VERSION}_${VARIANT}.apk"
          sha256sum dist/*.apk

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ matrix.variant }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

  draft-release:
    name: 创建草稿 Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: 下载 APK
        uses: actions/download-artifact@v4
        with:
          pattern: release-apk-*
          path: dist
          merge-multiple: true

      - name: 核对 APK
        run: sha256sum dist/*.apk

      - name: 创建草稿 Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: |
            这是 coding-back01/legado 仓库的首次公开构建。

            - `release` 为普通版本，包名为 `io.legado.app.release`。
            - `releaseA` 为共存版本，包名为 `io.legado.app.releaseA`。
            - 两个 APK 均使用本仓库独立保管的私有密钥签名。
            - 对应提交：`${{ github.sha }}`。

            本构建的签名与其他 Legado 发行版不同，不能直接覆盖安装其他签名的同包名版本。安装或迁移前请先备份数据。
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$VERSION" dist/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "legado_app_${VERSION}" \
            --notes "$RELEASE_NOTES" \
            --draft
