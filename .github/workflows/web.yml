name: Build Web

on:
  push:
    branches:
      - master
    paths:
      - 'modules/web/**'
      - 'app/src/main/assets/web/vue/**'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'modules/web/**'
      - 'app/src/main/assets/web/vue/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        id: pnpm-install
        with:
          version: 9.15.9
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v6
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Build and move files
        working-directory: modules/web
        run: |
          pnpm install --frozen-lockfile
          pnpm test:chapter-html
          pnpm build
          asset_status="$(git status --porcelain --untracked-files=all -- ../../app/src/main/assets/web/vue)"
          if [ -n "$asset_status" ]; then
            printf '%s\n' "$asset_status"
            exit 1
          fi
