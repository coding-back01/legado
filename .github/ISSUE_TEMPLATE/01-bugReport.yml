name: 错误报告
description: 报告当前个人 fork 普通正式版中可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        本仓库只受理 `coding-back01/legado` 普通正式版的错误报告，不承诺响应时限，功能请求默认不受理。
        疑似安全问题、凭据泄露或隐私问题请使用[私有漏洞报告](https://github.com/coding-back01/legado/security/advisories/new)，不要创建公开 Issue。

  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      description: 请确认该问题符合本仓库的维护范围。
      options:
        - label: 我使用的是本仓库发布的普通正式版，并已确认问题在当前版本仍可复现。
          required: true
        - label: 我已搜索现有 Issue，没有找到相同或相关报告。
          required: true
        - label: 该问题不是功能请求，也不要求新增其他设备或厂商专属兼容能力。
          required: true

  - type: input
    id: version
    attributes:
      label: 当前 fork 版本
      description: 请填写“我的—关于”中显示的完整版本号。
      placeholder: "3.26.082216"
    validations:
      required: true

  - type: input
    id: android-version
    attributes:
      label: Android 版本
      placeholder: "Android 14"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 设备型号
      placeholder: "厂商与完整型号"
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: 问题现象与期望结果
      description: 请分别说明实际发生了什么，以及你期望发生什么。
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 最小复现步骤
      description: 请从干净启动状态开始，逐步列出稳定复现所需的最少操作。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 已脱敏的日志或补充信息
      description: 只粘贴与复现时间窗相关且已脱敏的内容；网页端问题请同时说明浏览器版本。
      render: shell

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私与安全确认
      description: 公开提交前必须完成脱敏。
      options:
        - label: 我已删除 Cookie、Token、账号、私有 URL、备份内容、个人文件路径以及其他可识别个人身份的数据。
          required: true
        - label: 本报告不包含凭据泄露或其他需要私下报告的安全问题。
          required: true
